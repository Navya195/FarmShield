<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmShield - Logout Test</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f1f5f9; padding: 20px; }
        .container { max-width: 600px; margin: 50px auto; background: #1e293b; padding: 30px; border-radius: 12px; }
        h1 { color: #4ade80; }
        .test-section { margin: 20px 0; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px; }
        button { background: #4ade80; color: #0f172a; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #22c55e; }
        .result { margin-top: 10px; padding: 10px; border-radius: 6px; }
        .success { background: rgba(34, 197, 94, 0.2); color: #86efac; }
        .error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .info { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 FarmShield - Logout Functionality Test</h1>
        
        <div class="test-section">
            <h2>Session Status</h2>
            <button onclick="checkSession()">Check Session</button>
            <div id="sessionResult" class="result"></div>
        </div>

        <div class="test-section">
            <h2>Test Logout Function</h2>
            <p>This button will simulate the logout process:</p>
            <button onclick="testLogout()">Test Logout</button>
            <div id="logoutResult" class="result"></div>
        </div>

        <div class="test-section">
            <h2>Local Storage Check</h2>
            <button onclick="checkLocalStorage()">Check Storage</button>
            <div id="storageResult" class="result"></div>
        </div>

        <div class="test-section">
            <h2>Clear and Reset</h2>
            <button onclick="resetAll()">Reset All Data</button>
            <div id="resetResult" class="result"></div>
        </div>
    </div>

    <script>
        function showResult(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = 'result ' + type;
        }

        async function checkSession() {
            try {
                const response = await fetch('/api/auth/session', {credentials: 'same-origin'});
                const data = await response.json();
                if (data.authenticated) {
                    showResult('sessionResult', '✅ User authenticated: ' + data.user.email, 'success');
                } else {
                    showResult('sessionResult', '⚠️ No active session', 'info');
                }
            } catch (err) {
                showResult('sessionResult', '❌ Error: ' + err.message, 'error');
            }
        }

        async function testLogout() {
            console.log('🔴 Testing logout function...');
            
            // Store data before logout
            localStorage.setItem('test_key', 'test_value');
            sessionStorage.setItem('test_session', 'session_value');
            
            console.log('📝 Set test data in storage');
            console.log('   localStorage test_key:', localStorage.getItem('test_key'));
            console.log('   sessionStorage test_session:', sessionStorage.getItem('test_session'));
            
            // Test the logout endpoint
            try {
                const response = await fetch('/logout', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'same-origin'
                });
                
                console.log('🔴 Server response:', response.status);
                const data = await response.json();
                
                if (response.ok) {
                    console.log('🔴 Server logout successful:', data);
                    
                    // Clear client storage
                    localStorage.clear();
                    sessionStorage.clear();
                    console.log('🔴 Client storage cleared');
                    
                    // Verify storage is cleared
                    setTimeout(() => {
                        const localStorageEmpty = localStorage.length === 0;
                        const sessionStorageEmpty = sessionStorage.length === 0;
                        
                        console.log('🔴 Verification:');
                        console.log('   localStorage empty:', localStorageEmpty);
                        console.log('   sessionStorage empty:', sessionStorageEmpty);
                        
                        if (localStorageEmpty && sessionStorageEmpty) {
                            showResult('logoutResult', '✅ Logout successful! All session data cleared.', 'success');
                        } else {
                            showResult('logoutResult', '⚠️ Logout completed but some storage data remains', 'info');
                        }
                    }, 100);
                } else {
                    showResult('logoutResult', '❌ Server error: ' + data.error, 'error');
                }
            } catch (err) {
                showResult('logoutResult', '❌ Network error: ' + err.message, 'error');
            }
        }

        function checkLocalStorage() {
            const items = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                items.push(key + ': ' + localStorage.getItem(key));
            }
            
            if (items.length === 0) {
                showResult('storageResult', '✅ localStorage is empty (good for security)', 'success');
            } else {
                showResult('storageResult', '⚠️ localStorage contains: ' + items.join(', '), 'info');
            }
        }

        function resetAll() {
            localStorage.clear();
            sessionStorage.clear();
            
            if (localStorage.length === 0 && sessionStorage.length === 0) {
                showResult('resetResult', '✅ All storage data cleared', 'success');
            } else {
                showResult('resetResult', '❌ Failed to clear storage', 'error');
            }
        }

        // Auto-check on load
        window.addEventListener('load', () => {
            checkSession();
            checkLocalStorage();
        });
    </script>
</body>
</html>
